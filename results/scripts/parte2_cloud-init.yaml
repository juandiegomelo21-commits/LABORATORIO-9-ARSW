#cloud-config
# Instala node con nvm, clona el repo y deja FibonacciApp corriendo con forever (paso 5 de la Parte 2).
packages:
  - libatomic1  # requerida por node 26
runcmd:
  - sudo -u scalability_lab -i bash -c 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash && . ~/.nvm/nvm.sh && nvm install node && git clone https://github.com/DiegoATG/ARSW_LOAD-BALANCING_AZURE.git && cd ARSW_LOAD-BALANCING_AZURE/FibonacciApp && npm install && npm install forever -g && forever start FibonacciApp.js'
